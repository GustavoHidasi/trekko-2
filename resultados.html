<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Resultados — Trekko</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="resultados.css">

</head>
<body>
  <nav class="page-nav">
  <a href="index.html" class="back-btn">← Voltar</a>
  <a href="index.html" class="logo">
    <img src="uploads/trekko-logo2-transparent.png" alt="Trekko" />    
  </a>
  <span style="font-size:15px;font-weight:800;color:white;margin-left:4px">Resultados da busca</span>
</nav>
  <div class="page-wrap">

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap">
      <h1 style="font-size:20px;font-weight:900;color:white" id="results-heading">Resultados</h1>
      <span id="results-query-badge" class="badge bg"></span>
    </div>

    <button class="mobile-filter-btn" onclick="document.getElementById('filters-panel').classList.toggle('mobile-open')">
      Filtros
    </button>

    <div class="results-layout">
      <!-- Filters -->
      <div class="filters-panel" id="filters-panel">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
          <div style="font-size:16px;font-weight:900;color:white">Filtros</div>
          <button onclick="clearAllFilters()" style="background:none;border:none;color:rgba(255,255,255,.4);font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer">Limpar</button>
          <button class="back-btn" onclick="document.getElementById('filters-panel').classList.remove('mobile-open')" style="display:none;padding:4px 10px" id="close-filters-btn">✕</button>
        </div>

        <div class="filter-section">
          <div class="filter-title">Categoria</div>
          <div class="filter-opt active" onclick="toggleFilter(this,'cat','voos')" data-key="cat" data-val="voos">
            <div class="filter-check">✓</div>
            <span class="filter-opt-label">Voos</span>
            <span class="filter-opt-count">18</span>
          </div>
          <div class="filter-opt" onclick="toggleFilter(this,'cat','hoteis')" data-key="cat" data-val="hoteis">
            <div class="filter-check"></div>
            <span class="filter-opt-label">Hotéis</span>
            <span class="filter-opt-count">16</span>
          </div>
          <div class="filter-opt" onclick="toggleFilter(this,'cat','onibus')" data-key="cat" data-val="onibus">
            <div class="filter-check"></div>
            <span class="filter-opt-label">Ônibus</span>
            <span class="filter-opt-count">16</span>
          </div>
          <div class="filter-opt" onclick="toggleFilter(this,'cat','chales')" data-key="cat" data-val="chales">
            <div class="filter-check"></div>
            <span class="filter-opt-label">Chalés</span>
            <span class="filter-opt-count">16</span>
          </div>
          <div class="filter-opt" onclick="toggleFilter(this,'cat','atracoes')" data-key="cat" data-val="atracoes">
            <div class="filter-check"></div>
            <span class="filter-opt-label">Atrações</span>
            <span class="filter-opt-count">16</span>
          </div>
        </div>

        <div class="filter-section">
          <div class="filter-title">Faixa de preço</div>
          <div class="range-wrap">
            <div class="range-inputs">
              <input class="range-input" id="f-min" type="number" placeholder="R$ Min"/>
              <span class="range-sep">—</span>
              <input class="range-input" id="f-max" type="number" placeholder="R$ Max"/>
            </div>
            <button class="btn" style="width:100%;justify-content:center;padding:9px" onclick="applyFilters()">Aplicar</button>
          </div>
        </div>

        <div class="filter-section">
          <div class="filter-title">Classificação</div>
          <div class="stars-row">
            <div class="star-opt" onclick="this.classList.toggle('active');applyFilters()">⭐⭐⭐⭐⭐</div>
            <div class="star-opt" onclick="this.classList.toggle('active');applyFilters()">⭐⭐⭐⭐</div>
            <div class="star-opt" onclick="this.classList.toggle('active');applyFilters()">⭐⭐⭐</div>
          </div>
        </div>

        <div class="filter-section">
          <div class="filter-title">Companhia / Operadora</div>
          <div class="filter-opt active" onclick="toggleFilter(this,'comp','latam')" data-key="comp" data-val="latam">
            <div class="filter-check">✓</div>
            <span class="filter-opt-label">LATAM</span>
          </div>
          <div class="filter-opt active" onclick="toggleFilter(this,'comp','gol')" data-key="comp" data-val="gol">
            <div class="filter-check">✓</div>
            <span class="filter-opt-label">GOL</span>
          </div>
          <div class="filter-opt active" onclick="toggleFilter(this,'comp','azul')" data-key="comp" data-val="azul">
            <div class="filter-check">✓</div>
            <span class="filter-opt-label">Azul</span>
          </div>
        </div>

        <div class="filter-section">
          <div class="filter-title">Tag</div>
          <div class="filter-opt" onclick="toggleFilter(this,'tag','hot')" data-key="tag" data-val="hot">
            <div class="filter-check"></div>
            <span class="filter-opt-label">Popular</span>
          </div>
          <div class="filter-opt" onclick="toggleFilter(this,'tag','new')" data-key="tag" data-val="new">
            <div class="filter-check"></div>
            <span class="filter-opt-label">Novo</span>
          </div>
          <div class="filter-opt" onclick="toggleFilter(this,'tag','promo')" data-key="tag" data-val="promo">
            <div class="filter-check"></div>
            <span class="filter-opt-label">Promoção</span>
          </div>
        </div>
      </div>

      <!-- Results -->
      <div>
        <div class="results-header">
          <div class="results-count" id="results-count">Carregando...</div>
          <div class="results-sort">
            <span class="sort-label">Ordenar por</span>
            <select class="sort-select" id="sort-select" onchange="applyFilters()">
              <option value="price-asc">Menor preço</option>
              <option value="price-desc">Maior preço</option>
              <option value="popular">Mais popular</option>
              <option value="name">Nome A-Z</option>
            </select>
          </div>
        </div>
        <div id="results-list"></div>
      </div>
    </div>
  </div>

  <script>
    const DEST_IMGS = {
      /* VOOS - Foco em Paisagens Urbanas e Panoramas */
      v1:'https://loremflickr.com/280/160/riodejaneiro,cityscape,copacabana',
      v2:'https://loremflickr.com/280/160/salvador,pelourinho,architecture',
      v3:'https://loremflickr.com/280/160/fortaleza,cityscape,beach',
      v4:'https://loremflickr.com/280/160/florianopolis,landscape,bridge',
      v5:'https://loremflickr.com/280/160/manaus,cityscape,amazonas',
      v6:'https://loremflickr.com/280/160/recife,cityscape,architecture',
      v7:'https://loremflickr.com/280/160/portoalegre,cityscape,landmark',
      v8:'https://loremflickr.com/280/160/belem,architecture,landmark',
      v9:'https://loremflickr.com/280/160/saopaulo,skyline,cityscape',
      v10:'https://loremflickr.com/280/160/salvador,elevadorlacerda,landmark',
      v11:'https://loremflickr.com/280/160/fortaleza,beiramar,landscape',
      v12:'https://loremflickr.com/280/160/belohorizonte,skyline,cityscape',
      v13:'https://loremflickr.com/280/160/fernandodenoronha,landscape,ocean',
      v14:'https://loremflickr.com/280/160/maceio,landscape,coastline',
      v15:'https://loremflickr.com/280/160/saopaulo,avenidapaulista,cityscape',
      v16:'https://loremflickr.com/280/160/riodejaneiro,corcovado,monument',
      v17:'https://loremflickr.com/280/160/natal,landscape,dunes',
      v18:'https://loremflickr.com/280/160/belohorizonte,architecture,city',

      /* ONIBUS - Foco em Marcos Turísticos */
      o1:'https://loremflickr.com/280/160/riodejaneiro,sugarloaf,landscape',
      o2:'https://loremflickr.com/280/160/belohorizonte,pampulha,architecture',
      o3:'https://loremflickr.com/280/160/florianopolis,landscape,coast',
      o4:'https://loremflickr.com/280/160/curitiba,botanicalgarden,landmark',
      o5:'https://loremflickr.com/280/160/portoalegre,cityscape,monument',
      o6:'https://loremflickr.com/280/160/campinas,cityscape,architecture',
      o7:'https://loremflickr.com/280/160/buzios,landscape,village',
      o8:'https://loremflickr.com/280/160/angradosreis,landscape,coastline',
      o9:'https://loremflickr.com/280/160/salvador,faroldabarra,landmark',
      o10:'https://loremflickr.com/280/160/brasilia,architecture,monument',
      o11:'https://loremflickr.com/280/160/saopaulo,buildings,skyline',
      o12:'https://loremflickr.com/280/160/fozdoiguacu,waterfall,landscape',
      o13:'https://loremflickr.com/280/160/florianopolis,bridge,landmark',
      o14:'https://loremflickr.com/280/160/olinda,architecture,historic',
      o15:'https://loremflickr.com/280/160/natal,pontanegra,landscape',
      o16:'https://loremflickr.com/280/160/goiania,cityscape,park',

      /* HOTEIS - Foco em Fachadas e Estruturas (Removido termos genéricos de luxo que trazem fotos de pessoas) */
      h1:'https://loremflickr.com/280/160/hotel,facade,copacabana',
      h2:'https://loremflickr.com/280/160/resort,architecture,ipanema',
      h3:'https://loremflickr.com/280/160/hotel,building,saopaulo',
      h4:'https://loremflickr.com/280/160/resort,landscape,praiadoforte',
      h5:'https://loremflickr.com/280/160/hotel,architecture,fozdoiguacu',
      h6:'https://loremflickr.com/280/160/resort,coastline,maragogi',
      h7:'https://loremflickr.com/280/160/resort,architecture,florianopolis',
      h8:'https://loremflickr.com/280/160/hotel,mountain,camposdojordao',
      h9:'https://loremflickr.com/280/160/pousada,architecture,jericoacoara',
      h10:'https://loremflickr.com/280/160/resort,pool,portodegalinhas',
      h11:'https://loremflickr.com/280/160/lodge,nature,bonito',
      h12:'https://loremflickr.com/280/160/resort,architecture,trancoso',
      h13:'https://loremflickr.com/280/160/resort,landscape,itacare',
      h14:'https://loremflickr.com/280/160/historic,building,paraty',
      h15:'https://loremflickr.com/280/160/lodge,amazon,architecture',
      h16:'https://loremflickr.com/280/160/hotel,skyscraper,saopaulo',

      /* ATRACOES - Foco em Maravilhas Naturais */
      a1:'https://loremflickr.com/280/160/dunes,landscape,lencoismaranhenses',
      a2:'https://loremflickr.com/280/160/waterfall,landscape,chapadadiamantina',
      a3:'https://loremflickr.com/280/160/waterfall,landscape,iguazufalls',
      a4:'https://loremflickr.com/280/160/coastline,landscape,fernandodenoronha',
      a5:'https://loremflickr.com/280/160/landscape,nature,jalapao',
      a6:'https://loremflickr.com/280/160/river,landscape,bonito',
    };

    function getDestImg(id, scene, name) {
      return DEST_IMGS[id] || ('https://loremflickr.com/280/160/' + encodeURIComponent(name) + ',cityscape,landscape');
    }

    // Inline minimal DEST_DATA for this page
    var CATS = {
      voos: { label:'Voo', items:[
        {id:'v1',name:'Rio de Janeiro',meta:'São Paulo (GRU) → GIG',price:149,tag:'hot',b1:'GOL',b2:'LATAM',b3:'1h10'},
        {id:'v2',name:'Salvador',meta:'São Paulo (GRU) → SSA',price:289,tag:'',b1:'LATAM',b2:'Azul',b3:'2h10'},
        {id:'v3',name:'Fortaleza',meta:'São Paulo (GRU) → FOR',price:319,tag:'',b1:'GOL',b2:'Azul',b3:'2h50'},
        {id:'v4',name:'Florianópolis',meta:'São Paulo (GRU) → FLN',price:179,tag:'promo',b1:'LATAM',b2:'GOL',b3:'1h30'},
        {id:'v5',name:'Manaus',meta:'São Paulo (GRU) → MAO',price:499,tag:'',b1:'Azul',b2:'LATAM',b3:'3h50'},
        {id:'v13',name:'Fernando de Noronha',meta:'Recife (REC) → FEN',price:380,tag:'new',b1:'LATAM',b2:'Azul',b3:'1h20'},
        {id:'v7',name:'Porto Alegre',meta:'São Paulo (GRU) → POA',price:199,tag:'',b1:'GOL',b2:'LATAM',b3:'1h40'},
        {id:'v8',name:'Belém',meta:'São Paulo (GRU) → BEL',price:399,tag:'new',b1:'Azul',b2:'LATAM',b3:'3h30'},
      ]},
      hoteis: { label:'Hotel', items:[
        {id:'h1',name:'Copacabana Palace',meta:'Rio de Janeiro, RJ',price:1800,tag:'hot',b1:'⭐⭐⭐⭐⭐',b2:'Belmond',b3:'por noite'},
        {id:'h4',name:'Tivoli Ecoresort',meta:'Praia do Forte, BA',price:750,tag:'new',b1:'⭐⭐⭐⭐⭐',b2:'Resort',b3:'por noite'},
        {id:'h5',name:'Mabu Thermas',meta:'Foz do Iguaçu, PR',price:380,tag:'',b1:'⭐⭐⭐⭐',b2:'Resort',b3:'por noite'},
        {id:'h6',name:'Pousada do Toque',meta:'Maceió, AL',price:320,tag:'new',b1:'⭐⭐⭐⭐',b2:'Boutique',b3:'por noite'},
        {id:'h10',name:'Nannai Resort',meta:'Porto de Galinhas, PE',price:650,tag:'hot',b1:'⭐⭐⭐⭐⭐',b2:'Resort',b3:'por noite'},
      ]},
      atracoes: { label:'Atração', items:[
        {id:'a1',name:'Lençóis Maranhenses',meta:'Barreirinhas, MA',price:0,tag:'hot',b1:'Dunas',b2:'Lagoas',b3:'UNESCO'},
        {id:'a3',name:'Cataratas do Iguaçu',meta:'Foz do Iguaçu, PR',price:0,tag:'hot',b1:'UNESCO',b2:'7 Maravilhas',b3:'Parque'},
        {id:'a4',name:'Fernando de Noronha',meta:'PE',price:0,tag:'new',b1:'Praias',b2:'Mergulho',b3:'Ecoturismo'},
        {id:'a6',name:'Bonito',meta:'MS',price:0,tag:'',b1:'Rios cristalinos',b2:'Mergulho',b3:'Grutas'},
      ]},
    };
    var activeFilters = {cat:'voos', minPrice:null, maxPrice:null, tag:null};

    function getAllItems(){
      var cat = activeFilters.cat || 'voos';
      return (CATS[cat]||CATS.voos).items;
    }

    function applyFilters(){
      var items = getAllItems();
      var mn = parseFloat(document.getElementById('f-min').value)||0;
      var mx = parseFloat(document.getElementById('f-max').value)||Infinity;
      if(mn>0) items = items.filter(function(i){return i.price>=mn;});
      if(mx<Infinity) items = items.filter(function(i){return i.price<=mx;});
      var tag = document.querySelector('.filter-opt[data-key="tag"].active');
      if(tag) items = items.filter(function(i){return i.tag===tag.dataset.val;});
      var sort = document.getElementById('sort-select').value;
      if(sort==='price-asc') items.sort(function(a,b){return a.price-b.price;});
      else if(sort==='price-desc') items.sort(function(a,b){return b.price-a.price;});
      else if(sort==='name') items.sort(function(a,b){return a.name.localeCompare(b.name);});
      renderResults(items);
    }

    function toggleFilter(el, key, val){
      el.classList.toggle('active');
      el.querySelector('.filter-check').textContent = el.classList.contains('active') ? '✓' : '';
      if(key==='cat'){
        document.querySelectorAll('.filter-opt[data-key="cat"]').forEach(function(o){o.classList.remove('active');o.querySelector('.filter-check').textContent='';});
        el.classList.add('active');
        el.querySelector('.filter-check').textContent='✓';
        activeFilters.cat = val;
      }
      applyFilters();
    }

    function clearAllFilters(){
      document.getElementById('f-min').value='';
      document.getElementById('f-max').value='';
      document.querySelectorAll('.filter-opt').forEach(function(o){o.classList.remove('active');o.querySelector('.filter-check').textContent='';});
      document.querySelectorAll('.star-opt,.filter-opt[data-val="voos"]').forEach(function(o){o.classList.add('active');if(o.querySelector('.filter-check'))o.querySelector('.filter-check').textContent='✓';});
      applyFilters();
    }

    function renderResults(items){
      document.getElementById('results-count').textContent = items.length + ' resultado' + (items.length!==1?'s':'') + ' encontrado' + (items.length!==1?'s':'');
      var list = document.getElementById('results-list');
      if(!items.length){
        list.innerHTML='<div class="no-results"><span class="no-results-icon">🔍</span>Nenhum resultado. Tente ajustar os filtros.</div>';
        return;
      }
      list.innerHTML = items.map(function(item){
        var tagHtml = item.tag ? '<span class="badge '+(item.tag==='hot'?'br2':item.tag==='new'?'bg':'bo')+'">'+(item.tag==='hot'?'Popular':item.tag==='new'?'Novo':'Promo')+'</span>' : '';
        var priceHtml = item.price > 0 ? 'R$ '+item.price.toLocaleString('pt-BR') : 'Gratuito';
        var imgUrl = getDestImg(item.id, null, item.name);
        return '<div class="result-card" onclick="goToReserva(\''+item.name+'\',\''+item.id+'\')">'
          +'<img class="result-img" src="'+imgUrl+'" onerror="this.style.background=\'#1e3a5f\';this.src=\'\'"/>'
          +'<div class="result-info">'
            +'<div class="result-name">'+item.name+'</div>'
            +'<div class="result-meta">'+item.meta+'</div>'
            +'<div class="result-badges"><span class="badge bg">'+item.b1+'</span><span class="badge bb">'+item.b2+'</span>'+tagHtml+'</div>'
            +'<div class="result-features"><span class="result-feature">⏱ '+item.b3+'</span></div>'
          +'</div>'
          +'<div class="result-price-col">'
            +'<div><div class="result-price-from">a partir de</div><div class="result-price">'+priceHtml+'</div></div>'
            +'<button class="result-cta">Reservar</button>'
          +'</div>'
          +'</div>';
      }).join('');
    }

    function goToReserva(name, id){
      localStorage.setItem('trekko-dest-name', name);
      localStorage.setItem('trekko-dest-id', id);
      window.location.href = 'reserva.html?dest='+encodeURIComponent(name)+'&id='+id;
    }

    window.addEventListener('load', function(){
      var params = new URLSearchParams(window.location.search);
      var q = params.get('q') || '';
      var cat = params.get('cat') || '';
      
      if(cat) {
        var opt = document.querySelector('.filter-opt[data-key="cat"][data-val="'+cat+'"]');
        if(opt) {
          document.querySelectorAll('.filter-opt[data-key="cat"]').forEach(function(o){
            o.classList.remove('active');
            o.querySelector('.filter-check').textContent='';
          });
          opt.classList.add('active');
          opt.querySelector('.filter-check').textContent='✓';
          activeFilters.cat = cat;
        }
      }

      if(q){
        document.getElementById('results-heading').textContent = 'Resultados para "'+q+'"';
        document.getElementById('results-query-badge').textContent = q;
        document.getElementById('results-query-badge').style.display = 'inline-block';
      } else {
        document.getElementById('results-query-badge').style.display = 'none';
      }
      applyFilters();
    });
  </script>
</body>
</html>
